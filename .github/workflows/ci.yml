name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  # Format check runs separately so it can be required without
  # blocking the rest of the pipeline. Set to required: true once
  # the codebase is fully formatted (`npm run format` then commit).
  format:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  # Lighthouse runs against the production build served by `vite preview`.
  # Budgets live in .github/lighthouserc.json. Performance/SEO/Best-Practices
  # are warnings; accessibility is the only hard error so a11y regressions
  # can't land silently. /admin/* is intentionally not tested (auth-gated).
  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
